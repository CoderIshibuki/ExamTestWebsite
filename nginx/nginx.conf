worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream auth_service {
        server auth_service:8000;
    }

    upstream question_service {
        server question_service:8000;
    }

    upstream exam_service {
        server exam_service:8000;
    }

    upstream realtime_service {
        server realtime_service:8000;
    }

    upstream grading_service {
        server grading_service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway - Auth Service routes
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway - Question Service routes
        location /api/v1/questions/ {
            proxy_pass http://question_service/api/v1/questions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/categories/ {
            proxy_pass http://question_service/api/v1/categories/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway - Exam Service routes
        location /api/v1/exams/ {
            proxy_pass http://exam_service/api/v1/exams/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Gateway - Grading Service routes
        location /api/v1/grading/ {
            proxy_pass http://grading_service/api/v1/grading/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Real-time WebSocket
        location /ws/ {
            proxy_pass http://realtime_service/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger Docs for Auth Service
        location /docs {
            proxy_pass http://auth_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://auth_service/openapi.json;
            proxy_set_header Host $host;
        }
        
        # Healthcheck endpoint for nginx itself
        location / {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }
    }
}
